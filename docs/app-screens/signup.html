<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ScoutCopilot | Institutional Intelligence Sign Up</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              colors: {
                "on-secondary-container": "#b2b4c6",
                "inverse-primary": "#0053db",
                "on-tertiary-fixed-variant": "#3e465c",
                "surface-container-low": "#131b2e",
                "on-surface-variant": "#c3c6d7",
                "tertiary-container": "#656d84",
                "surface-container-lowest": "#060d20",
                "secondary-container": "#434655",
                "outline-variant": "#434655",
                "primary-fixed": "#dbe1ff",
                "on-background": "#dbe2fd",
                "on-primary-fixed-variant": "#003ea8",
                "inverse-on-surface": "#283044",
                "primary-container": "#2563eb",
                "on-tertiary-container": "#edf0ff",
                "inverse-surface": "#dbe2fd",
                "on-error-container": "#ffdad6",
                "on-error": "#690005",
                "surface-container": "#171f33",
                "surface-container-high": "#222a3e",
                "on-secondary": "#2d303e",
                "surface-dim": "#0b1326",
                "on-primary-container": "#eeefff",
                "surface-tint": "#b4c5ff",
                "tertiary-fixed-dim": "#bec6e0",
                "on-tertiary-fixed": "#131b2f",
                "background": "#0b1326",
                "on-primary-fixed": "#00174b",
                "surface-bright": "#31394e",
                "tertiary": "#bec6e0",
                "on-tertiary": "#283044",
                "error-container": "#93000a",
                "secondary-fixed-dim": "#c3c5d8",
                "outline": "#8d90a0",
                "surface-container-highest": "#2d3449",
                "secondary-fixed": "#e0e1f4",
                "error": "#ffb4ab",
                "on-primary": "#002a78",
                "primary-fixed-dim": "#b4c5ff",
                "on-secondary-fixed": "#181b28",
                "on-surface": "#dbe2fd",
                "tertiary-fixed": "#dae2fd",
                "secondary": "#c3c5d8",
                "primary": "#b4c5ff",
                "on-secondary-fixed-variant": "#434655",
                "surface-variant": "#2d3449",
                "surface": "#0b1326"
              },
              fontFamily: {
                "headline": ["Inter"],
                "body": ["Inter"],
                "label": ["Inter"],
                "mono": ["JetBrains Mono"]
              },
              borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem", "md": "0.375rem"},
            },
          },
        }
      </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            font-size: 1.25rem;
        }
      </style>
</head>
<body class="bg-background text-on-background font-body min-h-screen flex flex-col items-center justify-center p-6 selection:bg-primary-container selection:text-on-primary-container">
<!-- Top Navigation Suppression: Page is Transactional (Sign Up) -->
<main class="w-full max-w-[480px] flex flex-col items-center">
<!-- Logo Section -->
<div class="mb-8 text-center">
<h1 class="text-on-primary-container text-3xl font-bold tracking-tighter uppercase mb-2">ScoutCopilot</h1>
<p class="text-on-surface-variant font-mono text-[10px] uppercase tracking-widest">AI-Powered Football Scouting Intelligence</p>
</div>
<!-- Authentication Ledger Card -->
<div class="w-full bg-surface-container-low border border-outline-variant/20 rounded-md overflow-hidden">
<!-- Auth Tabs -->
<div class="flex border-b border-outline-variant/20">
<button class="flex-1 py-4 text-sm font-semibold text-on-surface-variant hover:text-on-surface transition-colors duration-200">
                    Sign In
                </button>
<button class="flex-1 py-4 text-sm font-semibold text-on-primary-container border-b-2 border-primary-container bg-surface-container">
                    Sign Up
                </button>
</div>
<!-- Form Content -->
<div class="p-8 space-y-6">
<form class="space-y-4">
<!-- Full Name -->
<div class="space-y-1.5">
<label class="block font-mono text-[10px] text-on-surface-variant uppercase tracking-wider">USER_LEGAL_NAME</label>
<input class="w-full bg-surface-container-low border border-outline-variant/40 rounded-md px-4 py-3 text-sm text-tertiary-fixed placeholder:text-on-surface-variant/50 focus:outline-none focus:border-primary-container transition-all" placeholder="Enter full name" type="text"/>
</div>
<!-- Email -->
<div class="space-y-1.5">
<label class="block font-mono text-[10px] text-on-surface-variant uppercase tracking-wider">INSTITUTIONAL_EMAIL</label>
<input class="w-full bg-surface-container-low border border-outline-variant/40 rounded-md px-4 py-3 text-sm text-tertiary-fixed placeholder:text-on-surface-variant/50 focus:outline-none focus:border-primary-container transition-all" placeholder="name@organization.com" type="email"/>
</div>
<!-- Password Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div class="space-y-1.5">
<label class="block font-mono text-[10px] text-on-surface-variant uppercase tracking-wider">ACCESS_KEY</label>
<input class="w-full bg-surface-container-low border border-outline-variant/40 rounded-md px-4 py-3 text-sm text-tertiary-fixed placeholder:text-on-surface-variant/50 focus:outline-none focus:border-primary-container transition-all" placeholder="••••••••" type="password"/>
</div>
<div class="space-y-1.5">
<label class="block font-mono text-[10px] text-on-surface-variant uppercase tracking-wider">VERIFY_KEY</label>
<input class="w-full bg-surface-container-low border border-outline-variant/40 rounded-md px-4 py-3 text-sm text-tertiary-fixed placeholder:text-on-surface-variant/50 focus:outline-none focus:border-primary-container transition-all" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- CTA -->
<button class="w-full bg-primary-container text-on-primary-container py-3.5 rounded-md font-semibold text-sm hover:bg-primary-container/90 active:scale-[0.98] transition-all mt-4" type="submit">
                        Create Account
                    </button>
</form>
<!-- Divider -->
<div class="relative flex items-center py-2">
<div class="flex-grow border-t border-outline-variant/30"></div>
<span class="flex-shrink mx-4 font-mono text-[10px] text-on-surface-variant uppercase tracking-tighter">or continue with</span>
<div class="flex-grow border-t border-outline-variant/30"></div>
</div>
<!-- SSO Buttons -->
<div class="grid grid-cols-2 gap-3">
<button class="flex items-center justify-center gap-2 py-2.5 border border-outline-variant/40 rounded-md text-sm text-on-surface hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-sm" data-icon="google">google</span>
                        Google
                    </button>
<button class="flex items-center justify-center gap-2 py-2.5 border border-outline-variant/40 rounded-md text-sm text-on-surface hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-sm" data-icon="terminal">terminal</span>
                        Microsoft
                    </button>
</div>
<!-- Legal Footer -->
<p class="text-[11px] text-on-surface-variant leading-relaxed text-center pt-2">
                    By signing up, you agree to our 
                    <a class="text-primary-container hover:underline" href="#">Terms of Service</a> 
                    and 
                    <a class="text-primary-container hover:underline" href="#">Privacy Policy</a>.
                </p>
</div>
</div>
<!-- Institutional Footer -->
<div class="mt-8 flex items-center gap-2 text-on-surface-variant font-mono text-[10px] uppercase tracking-widest">
<span class="material-symbols-outlined" data-icon="shield" style="font-size: 14px;">shield</span>
            Protected by SOC 2 Type II compliance
        </div>
</main>
<!-- Bottom Footer Anchor -->
<footer class="fixed bottom-0 w-full flex justify-between items-center px-8 py-4 bg-background border-t border-outline-variant/20 font-mono text-[10px] uppercase tracking-widest">
<div class="text-on-surface-variant">
            © 2024 ScoutCopilot Institutional Intelligence
        </div>
<div class="flex gap-6">
<a class="text-on-surface-variant hover:text-primary transition-opacity duration-200" href="#">Security Protocol</a>
<a class="text-on-surface-variant hover:text-primary transition-opacity duration-200" href="#">API Documentation</a>
<a class="text-on-surface-variant hover:text-primary transition-opacity duration-200" href="#">System Status</a>
</div>
</footer>
</body></html>
