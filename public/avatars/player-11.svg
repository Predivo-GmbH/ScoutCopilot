<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg11" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#244874"/>
      <stop offset="100%" stop-color="#1b365d"/>
    </linearGradient>
    <clipPath id="clip11">
      <rect width="120" height="120" rx="16"/>
    </clipPath>
  </defs>
  <g clip-path="url(#clip11)">
    <rect width="120" height="120" fill="url(#bg11)"/>
    <!-- Shoulders broad -->
    <ellipse cx="60" cy="118" rx="48" ry="36" fill="#142848"/>
    <!-- Neck -->
    <rect x="48" y="60" width="24" height="16" rx="5" fill="#142848"/>
    <!-- Head larger -->
    <circle cx="60" cy="44" r="23" fill="#142848"/>
    <!-- Polo collar with lines -->
    <path d="M45,84 L45,89 Q60,85 75,89 L75,84" fill="none" stroke="#2e5580" stroke-width="1.5"/>
    <!-- Single shoulder seam -->
    <line x1="28" y1="98" x2="45" y2="87" stroke="#2e5580" stroke-width="0.8" opacity="0.4"/>
    <line x1="92" y1="98" x2="75" y2="87" stroke="#2e5580" stroke-width="0.8" opacity="0.4"/>
  </g>
</svg>