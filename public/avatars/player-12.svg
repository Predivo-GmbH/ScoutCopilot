    <circle cx="61" cy="46" r="22" fill="#ab0028"/>
    <!-- Round collar -->
    <path d="M46,85 Q60,81 74,85" fill="none" stroke="#e83358" stroke-width="2.2"/>
    <!-- Vertical chest pin-stripe -->
    <line x1="50" y1="88" x2="50" y2="120" stroke="#e83358" stroke-width="0.6" opacity="0.3"/>
    <line x1="60" y1="86" x2="60" y2="120" stroke="#e83358" stroke-width="0.6" opacity="0.3"/>
    <line x1="70" y1="88" x2="70" y2="120" stroke="#e83358" stroke-width="0.6" opacity="0.3"/>
  </g>
</svg>