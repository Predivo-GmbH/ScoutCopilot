<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg12" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0163e"/>
      <stop offset="100%" stop-color="#d50032"/>
    </linearGradient>
    <clipPath id="clip12">
      <rect width="120" height="120" rx="16"/>
    </clipPath>
  </defs>
  <g clip-path="url(#clip12)">
    <rect width="120" height="120" fill="url(#bg12)"/>
    <!-- Shoulders -->
    <ellipse cx="60" cy="116" rx="45" ry="33" fill="#ab0028"/>
    <!-- Neck -->
    <rect x="50" y="62" width="20" height="14" rx="4" fill="#ab0028"/>
