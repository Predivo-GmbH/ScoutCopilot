<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f58b3a"/>
      <stop offset="100%" stop-color="#ee7623"/>
    </linearGradient>
    <clipPath id="clip6">
      <rect width="120" height="120" rx="16"/>
    </clipPath>
  </defs>
  <g clip-path="url(#clip6)">
    <rect width="120" height="120" fill="url(#bg6)"/>
    <!-- Shoulders narrow-ish -->
    <ellipse cx="60" cy="115" rx="42" ry="30" fill="#c55e18"/>
    <!-- Neck -->
    <rect x="52" y="63" width="16" height="13" rx="3" fill="#c55e18"/>
    <!-- Head -->
    <circle cx="60" cy="48" r="21" fill="#c55e18"/>
    <!-- V-neck -->
    <polyline points="51,87 60,95 69,87" fill="none" stroke="#f9a55c" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>