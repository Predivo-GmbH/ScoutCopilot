      <stop offset="0%" stop-color="#1abf62"/>
      <stop offset="100%" stop-color="#00a651"/>
    </linearGradient>
    <clipPath id="clip10">
      <rect width="120" height="120" rx="16"/>
    </clipPath>
  </defs>
  <g clip-path="url(#clip10)">
