<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg8" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdc62e"/>
      <stop offset="100%" stop-color="#fdb913"/>
    </linearGradient>
    <clipPath id="clip8">
      <rect width="120" height="120" rx="16"/>
    </clipPath>
  </defs>
  <g clip-path="url(#clip8)">
    <rect width="120" height="120" fill="url(#bg8)"/>
    <!-- Shoulders -->
    <ellipse cx="60" cy="114" rx="44" ry="32" fill="#d49a0f"/>
    <!-- Neck -->
    <rect x="50" y="64" width="20" height="12" rx="4" fill="#d49a0f"/>
    <!-- Head slightly left -->
    <circle cx="59" cy="49" r="21" fill="#d49a0f"/>
    <!-- Round collar -->
    <path d="M46,86 Q60,82 74,86" fill="none" stroke="#e8c94a" stroke-width="2"/>
    <!-- Black accent stripe (Dortmund-like) -->
    <line x1="60" y1="86" x2="60" y2="120" stroke="#b8880a" stroke-width="1.2" opacity="0.3"/>
  </g>
</svg>