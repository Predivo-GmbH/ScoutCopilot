<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg13" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#1a72c0"/>
      <stop offset="100%" stop-color="#005daa"/>
    </linearGradient>
    <clipPath id="clip13">
      <rect width="120" height="120" rx="16"/>
    </clipPath>
  </defs>
  <g clip-path="url(#clip13)">
    <rect width="120" height="120" fill="url(#bg13)"/>
    <!-- Shoulders -->
    <ellipse cx="60" cy="115" rx="44" ry="32" fill="#004a88"/>
    <!-- Neck -->
    <rect x="51" y="63" width="18" height="13" rx="4" fill="#004a88"/>
    <!-- Head -->
    <circle cx="60" cy="48" r="21" fill="#004a88"/>
    <!-- V-neck collar -->
    <polyline points="50,87 60,96 70,87" fill="none" stroke="#3388cc" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Diagonal chest sash -->
    <line x1="30" y1="120" x2="80" y2="85" stroke="#3388cc" stroke-width="2" opacity="0.25"/>
  </g>
</svg>