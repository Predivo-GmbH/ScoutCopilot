<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg16" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a3f9e"/>
      <stop offset="100%" stop-color="#003087"/>
    </linearGradient>
    <clipPath id="clip16">
      <rect width="120" height="120" rx="16"/>
    </clipPath>
  </defs>
  <g clip-path="url(#clip16)">
    <rect width="120" height="120" fill="url(#bg16)"/>
    <!-- Shoulders wide -->
    <ellipse cx="60" cy="118" rx="48" ry="36" fill="#00256b"/>
    <!-- Neck -->
    <rect x="48" y="60" width="24" height="16" rx="5" fill="#00256b"/>
    <!-- Head -->
    <circle cx="60" cy="44" r="23" fill="#00256b"/>
    <!-- Deep V-neck collar -->
    <polyline points="47,85 60,100 73,85" fill="none" stroke="#1a4da0" stroke-width="2" stroke-linecap="round"/>
    <!-- Diagonal sash -->
    <line x1="25" y1="120" x2="95" y2="85" stroke="#1a4da0" stroke-width="2.5" opacity="0.25"/>
  </g>
</svg>