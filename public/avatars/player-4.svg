<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg4" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#7a2150"/>
      <stop offset="100%" stop-color="#6c1d45"/>
    </linearGradient>
    <clipPath id="clip4">
      <rect width="120" height="120" rx="16"/>
    </clipPath>
  </defs>
  <g clip-path="url(#clip4)">
    <rect width="120" height="120" fill="url(#bg4)"/>
    <!-- Shoulders -->
    <ellipse cx="60" cy="114" rx="43" ry="31" fill="#541638"/>
    <!-- Neck -->
    <rect x="51" y="64" width="18" height="12" rx="4" fill="#541638"/>
    <!-- Head -->
    <circle cx="60" cy="49" r="21" fill="#541638"/>
    <!-- V-neck deep -->
    <polyline points="50,86 60,100 70,86" fill="none" stroke="#8a2e5c" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Shoulder seam lines -->
    <line x1="30" y1="95" x2="46" y2="88" stroke="#8a2e5c" stroke-width="0.8" opacity="0.5"/>
    <line x1="90" y1="95" x2="74" y2="88" stroke="#8a2e5c" stroke-width="0.8" opacity="0.5"/>
  </g>
</svg>