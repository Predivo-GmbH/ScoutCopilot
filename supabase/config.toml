# All functions handle JWT verification internally via supabaseUser.auth.getUser().
# verify_jwt must be false because the project uses ES256 JWTs (new Supabase auth format)
# which are incompatible with the edge runtime's HS256-based verify_jwt middleware.

[functions.billing-portal]
verify_jwt = false

[functions.checkout]
verify_jwt = false

[functions.compare]
verify_jwt = false

[functions.credentials]
verify_jwt = false

[functions.delete-account]
verify_jwt = false

[functions.enrich-photos]
verify_jwt = false

[functions.generate-photo]
verify_jwt = false

[functions.report]
verify_jwt = false

[functions.search]
verify_jwt = false

[functions.send-welcome]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false
