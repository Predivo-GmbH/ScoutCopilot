name: Rotate the production database password

# ONE-SHOT, MANUAL ONLY. Replaces the Postgres password of the ScoutCopilot PRODUCTION
# Supabase project with a freshly generated one, then proves the new value authenticates
# and that a wrong value does not. The value is generated on the runner, used, and
# discarded: it is never printed, never written to a file that survives the job, and
# never stored as a secret.
#
# WHY THIS FILE EXISTS (2026-09-09). ScoutCopilot's production database password was
# printed in full into a session transcript: a session wrote its own redaction mask
# because `safe-inspect` refused to scan `docs/Credentials.txt`, the mask only masked
# values of 20 characters or more, and the password was shorter than that. Rotation is
# the only repair for a printed credential — deleting the transcript copies never was.
#
# WHY IT RUNS HERE AND NOT ON A DEVELOPER MACHINE. The Supabase MANAGEMENT token that is
# allowed to change the password lives in this repository's secrets
# (`SUPABASE_ACCESS_TOKEN`) and nowhere else on the fleet. Run the work where the token
# already is, rather than copying the token to where the work is — the same rule
# `rotate-staging-basic-auth.yml` follows.
#
# WHAT THE ROW SAID, AND WHAT IS ACTUALLY TRUE. The board row claimed "no Management API
# endpoint exists for the database password, so it is a dashboard action only". That is
# wrong, and it is why the row sat on Roger. `PATCH /v1/projects/{ref}/database/password`
# is in the published Management API (api.supabase.com/api/v1-json, read 2026-09-09) and
# carries the OAuth scope `database:write`. Nobody has to open a browser.
#
# NOTHING CONSUMES THIS PASSWORD, which is why rotating it cannot break a deploy. Checked
# 2026-09-09 across ScoutCopilot, production-monitor, Cockpit and ci-runner: no
# `postgres://` connection string, no `supabase db push`, no `supabase link`. The app uses
# the anon key, the edge functions use the service-role key, and `scripts/apply-migrations.mjs`
# uses the Management API. The only reader of this password was a human with `psql`, and a
# human can mint a new one by running this workflow again.
#
# PRODUCTION ONLY, AND ONE PROJECT ONLY. The project ref is written in literally below.
# There is no input to this workflow and no path in it that can reach another project.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  rotate:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Rotate the Postgres password, then prove it from both sides
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: rlcsuqwqzoqjykdiqjye
          EXPECT_NAME: ScoutCopilot
        run: |
          set -uo pipefail
          umask 077

          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is empty. Refusing to continue."
            exit 1
          fi

          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client jq

          api() {  # api <method> <path> [body-file]  -> writes body to /tmp/api.out, echoes status
            local m="$1" p="$2" f="${3:-}"
            if [ -n "$f" ]; then
              curl -s -o /tmp/api.out -w '%{http_code}' -X "$m" \
                   -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                   -H 'Content-Type: application/json' \
                   --data @"$f" --max-time 60 "https://api.supabase.com$p"
            else
              curl -s -o /tmp/api.out -w '%{http_code}' -X "$m" \
                   -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                   --max-time 60 "https://api.supabase.com$p"
            fi
          }

          # -------------------------------------------------------------------------
          # 1. Prove the token can see THIS project, and that this ref is the one we
          #    think it is. A ref typed into a workflow is a guess until the API agrees.
          # -------------------------------------------------------------------------
          st=$(api GET "/v1/projects/$PROJECT_REF")
          if [ "$st" != "200" ]; then
            echo "::error::GET /v1/projects/$PROJECT_REF answered HTTP $st. The token cannot see"
            echo "this project, so nothing was changed."
            exit 1
          fi
          NAME=$(jq -r '.name' /tmp/api.out)
          REGION=$(jq -r '.region' /tmp/api.out)
          STATUS=$(jq -r '.status' /tmp/api.out)
          echo "--- project $PROJECT_REF is '$NAME' in $REGION, status $STATUS"
          if [ "$NAME" != "$EXPECT_NAME" ]; then
            echo "::error::That project is named '$NAME', not '$EXPECT_NAME'. Refusing to change"
            echo "the password of a project this workflow was not written for."
            exit 1
          fi

          # -------------------------------------------------------------------------
          # 2. Where to connect to prove it afterwards. The pooler's connection string
          #    is a CREDENTIAL, so it is parsed for host/port/user and those three are
          #    all that is ever echoed. The direct host db.<ref>.supabase.co is
          #    IPv6-only and a GitHub runner has no IPv6, which is why the pooler is
          #    used rather than assumed away.
          # -------------------------------------------------------------------------
          st=$(api GET "/v1/projects/$PROJECT_REF/config/database/pgbouncer")
          PGHOST=''; PGPORT=''; PGUSER=''
          if [ "$st" = "200" ]; then
            # The URL is parsed by a real URL parser, not by a regex of my own: host, port
            # and username are read out and printed, and the password field is never touched.
            eval "$(jq -r '.connection_string // ""' /tmp/api.out | node -e 'let s="";process.stdin.on("data",d=>{s+=d}).on("end",()=>{s=s.trim();if(!s)return;const u=new URL(s);console.log("PGHOST="+u.hostname);console.log("PGPORT="+(u.port||5432));console.log("PGUSER="+decodeURIComponent(u.username));});')"
          fi
          if [ -z "$PGHOST" ]; then
            echo "::warning::No pooler connection string was returned; falling back to the"
            echo "documented session-pooler shape for region $REGION."
            PGHOST="aws-0-$REGION.pooler.supabase.com"; PGPORT=5432; PGUSER="postgres.$PROJECT_REF"
          fi
          echo "--- will verify against $PGUSER@$PGHOST:$PGPORT (host, port and user are not secrets)"

          # -------------------------------------------------------------------------
          # 3. Generate and set the new password. It is written to a 0600 JSON file and
          #    handed to curl with --data @file, so it is never in argv, where every
          #    process on the runner could read it out of /proc.
          # -------------------------------------------------------------------------
          NEWPW=$(LC_ALL=C tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 48)
          if [ "${#NEWPW}" -ne 48 ]; then
            echo "::error::Failed to generate a 48-character password. Nothing was changed."
            exit 1
          fi
          BODY=$(mktemp); trap 'rm -f "$BODY" /tmp/api.out' EXIT
          jq -n --arg p "$NEWPW" '{password:$p}' > "$BODY"

          st=$(api PATCH "/v1/projects/$PROJECT_REF/database/password" "$BODY")
          echo "--- PATCH /v1/projects/$PROJECT_REF/database/password -> HTTP $st"
          rm -f "$BODY"
          if [ "$st" != "200" ]; then
            echo "::error::The Management API refused the change (HTTP $st). The printed password"
            echo "is therefore STILL LIVE. Read the message below, fix it, and re-run."
            jq -r '.message // .error // "no message"' /tmp/api.out 2>/dev/null || true
            exit 1
          fi

          # -------------------------------------------------------------------------
          # 4. Two probes, so "it worked" cannot be confused with "this database lets
          #    anyone in". Exit codes and psql's own output only: never a value.
          # -------------------------------------------------------------------------
          probe() {  # probe <password>  -> echoes ok | refused | unreachable
            local out rc
            out=$(PGPASSWORD="$1" PGCONNECT_TIMEOUT=20 psql \
                    -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d postgres \
                    -tAc 'select 1' 2>&1); rc=$?
            if [ $rc -eq 0 ] && [ "$out" = "1" ]; then echo ok
            elif echo "$out" | grep -qiE 'password authentication failed|Tenant or user not found'; then echo refused
            else echo "unreachable"; fi
          }

          sleep 20   # the control plane applies the change asynchronously

          new_result=''
          for attempt in 1 2 3 4 5; do
            new_result=$(probe "$NEWPW")
            [ "$new_result" = "ok" ] && break
            echo "    attempt $attempt with the new password -> $new_result"
            sleep 15
          done
          wrong_result=$(probe "not-the-password-$RANDOM$RANDOM$RANDOM")

          echo "--- controls"
          echo "    new password        -> $new_result      (must be ok)"
          echo "    a wrong password    -> $wrong_result     (must be refused)"

          if [ "$new_result" != "ok" ]; then
            echo "::error::The new password did not authenticate ($new_result). The change may"
            echo "have applied anyway — assume the printed password is dead and mint a new one by"
            echo "re-running this workflow, rather than assuming the old one still works."
            exit 1
          fi
          if [ "$wrong_result" != "refused" ]; then
            echo "::error::A deliberately wrong password was not refused ($wrong_result), so the"
            echo "success above proves nothing about authentication."
            exit 1
          fi

          echo "ROTATED: the production Postgres password of $NAME ($PROJECT_REF) is now a"
          echo "48-character random value generated in this job. It was never printed and is"
          echo "not stored anywhere: nothing on the fleet consumes it. Whoever next needs psql"
          echo "access sets a password they choose, through the dashboard or this same endpoint,"
          echo "and stores it in ONE place — the value in this job is deliberately unrecoverable."
          echo "The password printed into a transcript on 2026-09-09 is dead."
