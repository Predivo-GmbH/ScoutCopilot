name: Secret Scan (gitleaks)

# Blocks secrets from entering the repo. On PRs it scans the PR commits; on
# pushes it scans the pushed commits. Free for user-owned repos (no license).
# Anon/publishable Supabase keys are public by design (RLS-protected) — if a
# scan flags one, add it to .gitleaksignore with a comment, don't hide a real secret.

on:
  push:
  pull_request:
  workflow_dispatch:

# pull-requests: read is REQUIRED. gitleaks-action lists the PR's commits through the
# API, and without it every pull_request run dies with
# "RequestError [HttpError]: Resource not accessible by integration, status: 403"
# BEFORE scanning anything - a red check that never looked at a single file.
permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # TMPDIR is the RUNNER'S OWN temp folder, never the machine's /tmp. The action downloads to
          # os.tmpdir()/gitleaks.tmp and REFUSES if that file already exists; the predivo-wsl runners
          # share one /tmp and nobody cleans it, so a leftover file from another repo's run kills this
          # scan with "could not install gitleaks" having read zero files. Observed here 2026-09-14
          # the moment this job moved onto those runners. runner.temp is private and wiped per job.
          TMPDIR: ${{ runner.temp }}
          # The SARIF upload roots itself at $HOME (/home/runner) while the checkout lives under
          # /opt/gh-runners, so it throws AFTER "no leaks found" and turns a clean scan red. Nothing
          # reads that artifact; findings stay in the log and the job summary.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

      # The action above scans the COMMIT RANGE of the event, and that is not enough.
      # Proven 2026-08-20 on ReplyFlow: a merge commit introduced a service_role JWT and
      # this workflow reported "No leaks detected". A working-tree scan sees the file as
      # it now stands regardless of how it got there (same form deploy.yml uses).
      - name: gitleaks (working tree)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz -C "$RUNNER_TEMP" gitleaks
          chmod +x "$RUNNER_TEMP/gitleaks"
          "$RUNNER_TEMP/gitleaks" dir . --config .gitleaks.toml --redact --exit-code 1
