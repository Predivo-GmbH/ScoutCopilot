name: Deploy to Staging

# Staging environment for staging.scoutcopilot.com — hosts work-in-progress
# (footer redesign, SEO pages, etc.) for review BEFORE it reaches production.
# Triggered by pushing to the `staging` branch (or manually). Production is a
# SEPARATE workflow (deploy.yml, on `master`) and is never touched by this one.
#
# Database: staging has its OWN Supabase project (ysdaeexwhbwlbatcscqn), in the
# same Supabase account/org as production (fehhaubujickklmsjikb). Production is
# rlcsuqwqzoqjykdiqjye and is NEVER written by this workflow. Until 2026-09-02 both
# workflows applied migrations to the production ref, so a "staging" run WAS a
# production schema change; the guard step before the migration step now fails the
# build if those two refs are ever equal again.
#
# Protection: the deployed .htaccess adds HTTP Basic auth (creds live in the
# server-side .htpasswd at the docroot, placed once and excluded from deploy)
# plus X-Robots-Tag noindex, and robots.txt disallows all — so staging is never
# publicly reachable or indexed.

on:
  push:
    branches: [staging]
    paths-ignore:
      # '*.md' matches ROOT-LEVEL markdown only in GitHub Actions, so a docs-only change
      # in any subfolder still triggered a full deploy. No markdown in this repo is a
      # build input (checked for `import ... .md`, `?raw` and import.meta.glob), so it
      # is safe to ignore markdown at any depth.
      - '*.md'
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy-staging:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - name: Verify FTP credentials (fail fast on a stale secret)
        # A stale FTP secret used to surface late and confusingly. The site-id guard
        # tests `[ -n "$REMOTE_ID" ]`, and a 530 leaves REMOTE_ID empty - so the guard
        # printed "guard passed (remote='')" at the exact moment auth broke, and the run
        # only failed later inside the mirror, after up to 4 retries. This logs in once,
        # up front, and names the failure. curl exit 67 == FTP login denied; curl needs
        # no lftp, so this can run before checkout. (Added 2026-08-23 after the whole
        # fleet's FTP_PASS went stale at once.)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          set +e
          # --insecure mirrors `set ssl:verify-certificate no`, which every lftp call in
          # this fleet already uses: the Metanet cert is issued for tertia.sui-inter.net,
          # not for the FTP_HOST value, so verification fails with curl exit 60. The
          # control channel is still TLS; only name verification is skipped.
          # One slow answer from a busy FTP server is not a bad password. Retry the
          # transport, never the credential: curl 67 ("Access denied: 530") is final,
          # because a wrong password does not become right on attempt two. Added after
          # 15 simultaneous fleet deploys made this step time out at 30s (curl 28).
          n=0
          while :; do
            OUT=$(curl -sS --ssl-reqd --insecure --connect-timeout 20 --max-time 90 --user "$FTP_USER:$FTP_PASS" "ftp://$FTP_HOST/" 2>&1)
            RC=$?
            if [ "$RC" -eq 0 ] || [ "$RC" -eq 67 ]; then break; fi
            n=$((n+1))
            if [ "$n" -ge 3 ]; then break; fi
            echo "FTP pre-flight attempt $n failed (curl exit $RC) - retrying in $((n*10))s"
            sleep $((n*10))
          done
          set -e
          if [ "$RC" -eq 67 ]; then
            echo "::error::FTP login denied (530) for $FTP_USER@$FTP_HOST - the FTP password secret is stale. Nothing was deployed."
            exit 1
          fi
          if [ "$RC" -ne 0 ]; then
            echo "::error::FTP connection failed (curl exit $RC) for $FTP_USER@$FTP_HOST. Nothing was deployed."
            printf '%s\n' "$OUT" | head -5
            exit 1
          fi
          echo "FTP auth OK - $(printf '%s\n' "$OUT" | grep -c '') entries at the account root."

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # cache: npm removed deliberately - see the "NPM CACHE / self-hosted runner" note in deploy.yml

      - name: Cache node_modules
        id: node-cache
        # Skipped on the persistent self-hosted runner: the path already survives there,
        # so the save post-step is a multi-minute upload that buys nothing and can blow
        # the job timeout. see the "NPM CACHE / self-hosted runner" note in deploy.yml
        if: runner.environment != 'self-hosted'
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}
      - name: Install deps
        if: steps.node-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Install Puppeteer browser for prerendering
        run: npx puppeteer browsers install chrome

      - name: Build for staging
        run: npm run build
        env:
          # Staging has its OWN Supabase project (ysdaeexwhbwlbatcscqn, eu-central-2),
          # in the SAME Supabase account/org as production (fehhaubujickklmsjikb), per
          # Roger's rule. Created 2026-09-02; before that, staging built against the
          # PRODUCTION project, so "staging" was production. The framework-facing var
          # names are deliberately identical to deploy.yml — only the secret behind
          # them swaps, which is the fleet convention.
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_STAGING_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_STAGING_ANON_KEY }}
          # Sentry (error monitoring pilot, STAGING ONLY): DSN inlined into the bundle;
          # auth token (+ org/project) enables source-map upload. environment is tagged
          # by hostname at runtime, so this same DSN produces "staging.scoutcopilot.com"
          # tagged events here. NOT wired into deploy.yml (production) yet — pilot scope.
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

      # Migrations land on the STAGING database only. This ref MUST differ from the one
      # in deploy.yml (rlcsuqwqzoqjykdiqjye) — if the two ever match again, a staging run
      # is a production write and a green staging run proves nothing about production.
      # The guard step below fails the build if that regression is reintroduced.
      - name: Guard — staging ref must not be the production ref
        run: |
          STAGING_REF=$(grep -oE 'apply-migrations\.mjs --project-ref [a-z]+' .github/workflows/deploy-staging.yml | awk '{print $3}')
          PROD_REF=$(grep -oE 'apply-migrations\.mjs --project-ref [a-z]+' .github/workflows/deploy.yml | awk '{print $3}')
          echo "staging ref: $STAGING_REF"
          echo "prod ref:    $PROD_REF"
          if [ -z "$STAGING_REF" ] || [ -z "$PROD_REF" ]; then
            echo "::error::could not read both project refs — the guard cannot prove separation, so it fails closed."
            exit 1
          fi
          if [ "$STAGING_REF" = "$PROD_REF" ]; then
            echo "::error::deploy-staging.yml targets the PRODUCTION database ($PROD_REF). Staging must have its own project."
            exit 1
          fi
          echo "Separation OK: staging and production are different Supabase projects."

      - name: Apply database migrations to staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/apply-migrations.mjs --project-ref ysdaeexwhbwlbatcscqn

      - name: Prepare staging .htaccess (basic-auth + noindex)
        run: |
          # Reuse the REAL production .htaccess (from the build) so staging catches
          # the same Apache/rewrite behaviour, then prepend Basic auth and append a
          # noindex header.
          mv dist/.htaccess /tmp/prod.htaccess
          {
            echo 'AuthType Basic'
            echo 'AuthName "ScoutCopilot Staging"'
            echo 'AuthUserFile /var/www/vhosts/scoutcopilot.com/staging.scoutcopilot.com/.htpasswd'
            echo 'Require valid-user'
            echo ''
            cat /tmp/prod.htaccess
            echo ''
            echo '# --- Staging overrides ---'
            echo '<IfModule mod_headers.c>'
            echo '  Header always set X-Robots-Tag "noindex, nofollow"'
            echo '</IfModule>'
          } > dist/.htaccess

      - name: Staging robots.txt (disallow all)
        run: |
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt

      - name: Deploy staging via FTPS
        # Zero-downtime, matching this repo's own production job. A single
        # `mirror --delete` uploads and deletes in ONE pass, so mid-mirror the new
        # index.html can be live while its hashed chunks are not yet uploaded and the old
        # ones are already gone: every chunk 404s and the page renders BLANK. Proven
        # 2026-08-23 in ReplyFlow run 32662317038 (index.html 200, five chunks 404, blank
        # screenshot) where it failed an E2E gate and read as a flaky test. Assets first
        # without --delete, so new chunks exist before anything references them.
        #
        # The root mirror keeps --delete but EXCLUDES assets/: a browser tab still
        # running an OLD index.html fetches the OLD hashed chunks (lazily, on the next
        # navigation), and deleting them at deploy time turns that into "Failed to fetch
        # dynamically imported module" (fleet Sentry reports 2026-08-29, e.g. valrano
        # staging). Old chunks are pruned by AGE (14 days) in the step below — long
        # after every open tab has either reloaded or gone away.
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          sudo apt-get install -y lftp
          echo "scoutcopilot-staging" > ./dist/.site-id
          # ssl-protect-data no = login/control stays TLS-encrypted (creds safe), data
          # channel goes clear (PROT C, which Metanet accepts). Fixes the intermittent
          # "max-retries exceeded" hang (encrypted passive data channel vs GitHub-runner
          # NAT — see standards/deploy-standard.md). Excludes .htpasswd (server-managed)
          # and cgi-bin/ from the --delete mirror so they survive.
          SETTINGS="set ftp:ssl-force yes; set ssl:verify-certificate no; set ftp:ssl-protect-data no; set ftp:passive-mode yes; set ftp:prefer-epsv no; set net:timeout 30; set net:max-retries 4; set net:persist-retries 4; set net:reconnect-interval-base 8; set net:reconnect-interval-multiplier 1; set mirror:parallel-transfer-count 4;"
          CMDS="$SETTINGS mirror --reverse --no-perms --verbose ./dist/assets/ staging.scoutcopilot.com/assets/; mirror --reverse --delete --no-perms --verbose --exclude '^assets/' --exclude .htpasswd --exclude cgi-bin/ ./dist/ staging.scoutcopilot.com/; bye"
          n=0
          until [ $n -ge 4 ]; do
            # timeout: kill a hung FTPS control connection so the retry loop can
            # proceed instead of eating the whole job timeout (Metanet lftp hang).
            if timeout 420 lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" -e "$CMDS"; then
              echo "Staging FTP deploy succeeded (attempt $((n+1)))"; exit 0
            fi
            n=$((n + 1)); echo "::warning::Staging FTP attempt $n failed (transient FTPS data-channel blip — runner-side); retrying in 25s..."; sleep 25
          done
          echo "::error::Staging FTP deploy failed after 4 attempts"; exit 1

      - name: Prune stale assets (14-day retention)
        # Age-based cleanup of the hashed chunks the asset-retention exclusion above
        # leaves behind. lftp has no find -mtime (only -max-depth/-ls — verified against
        # the 4.8.1 man page), so this probes each file's mtime over raw FTP MDTM
        # (RFC 3659, supported by the ProFTPD on this host) and deletes files older than
        # 14 days. 14 days ≫ any realistically open tab, so stale-tab chunk fetches 404
        # only for sessions older than the retention window.
        #
        # Never fails the deploy: a cleanup hiccup must not block promotion-relevant
        # runs; it logs ::error:: (red annotation, run still green) and the next deploy
        # retries. Capped at 1000 deletions per run so a logic bug cannot mass-delete
        # and a long outage self-heals progressively over successive deploys.
        continue-on-error: true
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          ASSETS_DIR: staging.scoutcopilot.com/assets
        run: |
          # GitHub wraps every run block in bash -e: a failing command substitution in an
          # assignment (e.g. LIST=$(lftp ...)) would abort the whole step BEFORE the script's
          # own rc guards run. Cleanup must never abort mid-run — disable -e first.
          set +e
          set -u
          export TZ=UTC
          DAYS=14
          CUTOFF=$(date -u -d "$DAYS days ago" +%Y%m%d%H%M%S)
          SETTINGS="set ftp:ssl-force yes
          set ssl:verify-certificate no; set ftp:ssl-protect-data no
          set ftp:passive-mode yes; set net:timeout 60"

          LIST=$(timeout 180 lftp -u "$FTP_USER,$FTP_PASS" "ftp://$FTP_HOST" <<SCRIPT 2>&1
          $SETTINGS
          find $ASSETS_DIR
          quit
          SCRIPT
          )
          if [ $? -ne 0 ]; then
            echo "::error::Asset prune: listing $ASSETS_DIR failed - leaving cleanup to the next deploy. Output: $(echo "$LIST" | head -3)"
            exit 0
          fi
          if [ -z "$(echo "$LIST" | tr -d '[:space:]')" ]; then
            echo "Asset prune: $ASSETS_DIR is empty - nothing to do."
            exit 0
          fi

          # Probe every file's mtime in ONE lftp session: echo a PROBE: name line before
          # each quote MDTM so reply lines stay paired with their file even when a file
          # vanishes (550) between listing and probing.
          PROBE_SCRIPT=$(mktemp)
          {
            echo "open -u $FTP_USER,$FTP_PASS ftp://$FTP_HOST"
            echo "$SETTINGS"
            # find prints full remote paths ("$ASSETS_DIR/<nested>/file", recursively —
            # nested chunk dirs like _next/static/chunks are covered too); normalize to a
            # path relative to ASSETS_DIR so either output format is safe.
            echo "$LIST" | while IFS= read -r p; do
              p="${p%$'\r'}"
              [ "$p" = "$ASSETS_DIR" ] && continue
              rel="${p#"$ASSETS_DIR"/}"
              # Hashed asset names only ([A-Za-z0-9._/-], no spaces/globs) — anything
              # else is skipped, never deleted.
              [[ "$rel" =~ ^[A-Za-z0-9._/-]+$ ]] || continue
              echo "echo \"PROBE:$ASSETS_DIR/$rel\""
              echo "quote MDTM $ASSETS_DIR/$rel"
            done
            echo "quit"
          } > "$PROBE_SCRIPT"

          OUT=$(timeout 420 lftp -f "$PROBE_SCRIPT" 2>&1)
          rm -f "$PROBE_SCRIPT"

          # Pair each PROBE: line with the following 213/550 reply; 14-digit UTC
          # timestamps compare correctly as plain strings against the 14-digit cutoff.
          PAIRED=$(awk '
            /^PROBE:/ { file=substr($0, 7); next }
            file != "" {
              if ($1 == "213" && $2 ~ /^[0-9]{14}$/) print $2, file
              file=""
            }' <<< "$OUT")
          if [ -z "$PAIRED" ]; then
            echo "::error::Asset prune: no MDTM replies from $ASSETS_DIR (server may not support RFC 3659 MDTM) - leaving cleanup to the next deploy."
            exit 0
          fi

          OLD=$(sort -n <<< "$PAIRED" | awk -v cutoff="$CUTOFF" '$1 < cutoff {print $2}' | head -1000)
          COUNT=$(echo "$OLD" | grep -c . || true)
          if [ "$COUNT" -eq 0 ]; then echo "Asset prune: nothing older than $DAYS days in $ASSETS_DIR."; exit 0; fi

          DEL_SCRIPT=$(mktemp)
          {
            echo "open -u $FTP_USER,$FTP_PASS ftp://$FTP_HOST"
            echo "$SETTINGS"
            # lftp rm does NOT glob-expand - hashed names are passed verbatim.
            # $OLD already holds full remote paths (the PROBE: values).
            echo "$OLD" | while IFS= read -r f; do echo "rm $f"; done
            echo "quit"
          } > "$DEL_SCRIPT"
          DEL_OUT=$(timeout 300 lftp -f "$DEL_SCRIPT" 2>&1)
          rm -f "$DEL_SCRIPT"
          echo "$DEL_OUT"
          echo "Asset prune: deleted $COUNT file(s) older than $DAYS days from $ASSETS_DIR."
          exit 0

      - name: Verify staging is alive (catches .htaccess errors + confirms auth)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -u "${{ secrets.STAGING_HTPASSWD_USER }}:${{ secrets.STAGING_HTPASSWD_PASS }}" https://staging.scoutcopilot.com/en --retry 4 --retry-all-errors --retry-delay 8 --max-time 30)
          if [ "$STATUS" != "200" ]; then
            echo "::error::Staging returned HTTP $STATUS — likely .htaccess error or auth misconfig."
            exit 1
          fi
          echo "Staging health check passed (HTTP $STATUS)"
