name: Deploy to Production

# STAGING-FIRST PIPELINE (deploy-standard §163 + Rule 63) — production is a
# deliberate, gated promotion, NEVER an automatic side-effect of pushing to
# master. Pushes to `staging` deploy to staging (see deploy-staging.yml) for
# review; shipping to production requires a manual workflow_dispatch with
# confirm="deploy" typed in, exactly like launchready/Valrano/SignalScore.
# Converted from push-to-master-auto-prod 2026-08-15 (G2 staging-first ruling).

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm PRODUCTION deploy'
        required: true
        default: ''

concurrency:
  group: deploy-production
  # false: never cancel an in-flight PRODUCTION deploy — a push arriving mid-FTP-mirror
  # could abort partway through and leave scoutcopilot.com in an inconsistent
  # (half-deployed) state. New pushes queue and run after the current deploy finishes.
  cancel-in-progress: false

# ===========================================================================
# NPM CACHE / self-hosted runner — deliberately absent.
# Do not add `cache: npm` back to setup-node, and do not remove the
# `runner.environment != 'self-hosted'` guards on the actions/cache steps.
#
# These jobs run on a PERSISTENT self-hosted runner (vars.RUNNER_LABEL =
# predivo-wsl). There, ~/.npm and ~/.cache/ms-playwright are not throwaway
# caches a job populates and discards: they are directories holding everything
# this machine has ever installed, for every repo on it. The cache-save runs as
# a POST-STEP INSIDE the job's own timeout-minutes budget, so when it is slow it
# does not merely waste time — it KILLS the job.
#
# And it misses precisely when it matters: the cache key is derived from
# package-lock.json, so the save fires on exactly the dependency-changing
# commits a security gate exists to inspect. Every other commit gets a cache hit
# and sails through, which is why this stayed invisible for so long.
#
# GitHub records a timeout as `cancelled`, NOT `failed`. Every real step inside
# the job shows green, the run page looks clean, and downstream jobs with
# `needs:` are silently SKIPPED — so a production promotion can be lost without
# anything showing red. Verify the deploy JOB, never the run colour.
#
# Measured, not inferred (2026-09-02/03):
#   BoatBuddy   run 33718969126 gate-integration: npm ci 18s, tests 3s, then
#               Post Run actions/setup-node cancelled after 9m34s at
#               "Sent 1006632960 of 1811836788 (55.6%)" — a 1.81 GB upload.
#   launchready run 33664843636 gate-security cancelled -> deploy SKIPPED.
#   arivioo     runs 33659826937 / 33662539216 gate-security cancelled (~9m35s).
#   predivo     run 33792521636 critical-path killed by the PLAYWRIGHT cache
#               save (544s) — the same fault, a different cache.
#   signalscore run 33729943705 gates: Playwright cache save cancelled at 779s.
#
# The fix is to REMOVE the work that does not belong inside the budget, never to
# widen the timeout — a wider timeout hides this instead of fixing it. npm ci
# already reads the host's ~/.npm directly, so the cache bought nothing here.
# The guards keep the caches working on GitHub-hosted runners, where they are a
# genuine win and the machine is thrown away afterwards.
# ===========================================================================

env:
  # Needed by npm ci: .npmrc points @predivo-gmbh at GitHub Packages. Without this the
  # install 401s on @predivo-gmbh/gate-kit. A job must carry the environment its steps read:
  # that is the workflow-env check gate-kit 0.4.3 added on 2026-09-06, which never reached
  # this repository because it had no gate-kit dependency to reach it by.
  # PACKAGES_READ_TOKEN IS PRESENT AND EMPTY IN THIS REPOSITORY (measured 2026-09-10): a working
  # repo logs `NODE_AUTH_TOKEN: ***`, this one logged it blank. It did not matter until 2026-09-10,
  # when @predivo-gmbh/gate-kit entered package.json - from that commit on, EVERY `npm ci` here
  # reaches the private registry and a blank token 401s the job. This workflow would have been the
  # next casualty. secrets.GITHUB_TOKEN can read the package (ScoutCopilot was granted Actions read
  # access on the gate-kit package the same day) and every job already carries one; an empty secret
  # is falsy in an expression, so a real PACKAGES_READ_TOKEN takes over the moment one is set.
  NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}

jobs:
  # ===========================================================================
  # SECURITY GATE (G3, deploy-standard §4d) — blocks prod promotion. gitleaks
  # full-history secret scan + `npm audit --audit-level=high`. AI
  # security-review stays advisory. Fleet retrofit 2026-08-15 (clean at critical),
  # Wave 3 2026-08-17 tightened floor to high.
  # ===========================================================================
  gate-security:
    if: github.event_name != 'push'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz -C /tmp gitleaks
          chmod +x /tmp/gitleaks
      - name: 'Secret scan: working tree (BLOCKING - new committed-file leaks)'
        run: /tmp/gitleaks dir . --no-banner --redact -v --exit-code 1
      - name: 'Secret scan: full history (AUDIT only, non-blocking - historical secrets rotated-dead 2026-07-07, deliberate no-scrub)'
        run: /tmp/gitleaks git . --no-banner --redact --log-opts=--all --exit-code 0 || true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Dependency audit (blocking at high)
        # --omit=dev: PRODUCTION dependencies only. A dev-only advisory (build tooling, scaffolding
        # CLIs) never reaches a customer, so it must not block a release (Roger 2026-09-03). Dev/
        # build-time deps are covered by the scheduled fleet audit, which files a work item instead of
        # blocking. Both directions proven: production-monitor/test/audit-scope-both-directions.test.mjs
        run: npm audit --omit=dev --audit-level=high
      # SAST — code-level security (fleet-hardening Wave 2, proven route from project-starter).
      # A different layer than npm audit (deps) + gitleaks (secrets in git): semgrep reads OUR
      # code for injection / XSS / hardcoded secrets. `.semgrepignore` excludes test/dev files
      # (example tokens + fixtures = false positives). --severity=ERROR = highest confidence;
      # --error fails the gate on a real finding.
      - name: SAST scan (semgrep)
        run: |
          python3 -m pip install --quiet --user --break-system-packages semgrep
          export PATH="$HOME/.local/bin:$PATH"
          semgrep scan --config=p/security-audit --config=p/secrets --severity=ERROR --error --metrics=off .

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'deploy'
    needs: [gate-security]
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20

    steps:
      - name: Verify FTP credentials (fail fast on a stale secret)
        # A stale FTP secret used to surface late and confusingly. The site-id guard
        # tests `[ -n "$REMOTE_ID" ]`, and a 530 leaves REMOTE_ID empty - so the guard
        # printed "guard passed (remote='')" at the exact moment auth broke, and the run
        # only failed later inside the mirror, after up to 4 retries. This logs in once,
        # up front, and names the failure. curl exit 67 == FTP login denied; curl needs
        # no lftp, so this can run before checkout. (Added 2026-08-23 after the whole
        # fleet's FTP_PASS went stale at once.)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          set +e
          # --insecure mirrors `set ssl:verify-certificate no`, which every lftp call in
          # this fleet already uses: the Metanet cert is issued for tertia.sui-inter.net,
          # not for the FTP_HOST value, so verification fails with curl exit 60. The
          # control channel is still TLS; only name verification is skipped.
          # One slow answer from a busy FTP server is not a bad password. Retry the
          # transport, never the credential: curl 67 ("Access denied: 530") is final,
          # because a wrong password does not become right on attempt two. Added after
          # 15 simultaneous fleet deploys made this step time out at 30s (curl 28).
          n=0
          while :; do
            OUT=$(curl -sS --ssl-reqd --insecure --connect-timeout 20 --max-time 90 --user "$FTP_USER:$FTP_PASS" "ftp://$FTP_HOST/" 2>&1)
            RC=$?
            if [ "$RC" -eq 0 ] || [ "$RC" -eq 67 ]; then break; fi
            n=$((n+1))
            if [ "$n" -ge 3 ]; then break; fi
            echo "FTP pre-flight attempt $n failed (curl exit $RC) - retrying in $((n*10))s"
            sleep $((n*10))
          done
          set -e
          if [ "$RC" -eq 67 ]; then
            echo "::error::FTP login denied (530) for $FTP_USER@$FTP_HOST - the FTP password secret is stale. Nothing was deployed."
            exit 1
          fi
          if [ "$RC" -ne 0 ]; then
            echo "::error::FTP connection failed (curl exit $RC) for $FTP_USER@$FTP_HOST. Nothing was deployed."
            printf '%s\n' "$OUT" | head -5
            exit 1
          fi
          echo "FTP auth OK - $(printf '%s\n' "$OUT" | grep -c '') entries at the account root."

      - uses: actions/checkout@v5
        with:
          # fetch-depth: 0 so the last-production-deploy commit is in local history for the
          # functionality gate to diff back to. A shallow checkout only holds the tip, which is
          # exactly the state that let 24 of 30 direct-pushed changes ship unchecked.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # cache: npm removed deliberately - see the "NPM CACHE / self-hosted runner" note in deploy.yml

      - name: Cache node_modules
        id: node-cache
        # Skipped on the persistent self-hosted runner: the path already survives there,
        # so the save post-step is a multi-minute upload that buys nothing and can blow
        # the job timeout. see the "NPM CACHE / self-hosted runner" note in deploy.yml
        if: runner.environment != 'self-hosted'
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - name: Install deps
        if: steps.node-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Coverage
        run: npm run test:coverage

      # Resolve the base the functionality gate diffs against: the commit that was live in
      # PRODUCTION at the last successful deploy. Without this the checker defaults to
      # origin/master...HEAD, which on a workflow_dispatch deploy from master is HEAD===origin/master
      # === an EMPTY range: the gate passed on every deploy and NEVER looked at what it was shipping.
      # The PR-context gate (test.yml) only ever sees changes that arrive through a pull request;
      # anything DIRECT-PUSHED to master (24 of the last 30 changes, measured 2026-09-19) reached
      # production with no gate at all. Diffing from the last production deploy closes that hole: it
      # checks every commit since we last shipped, however it landed. Fail-closed - an unresolvable
      # base blocks the deploy rather than silently reverting to the empty-range no-op.
      - name: Resolve the last production deploy as the functionality-gate base (fail-closed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api() {
            curl -sS --fail-with-body \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}$1"
          }
          # Most recent successful workflow_dispatch runs of THIS workflow, newest first.
          run_ids=$(api "/actions/workflows/deploy.yml/runs?event=workflow_dispatch&status=success&per_page=30" \
            | jq -r ".workflow_runs[] | select(.id != ${GITHUB_RUN_ID}) | .id")
          base=""
          for rid in $run_ids; do
            # A run counts as a real production deploy only if its 'deploy' job actually concluded
            # success (a dispatch with confirm != 'deploy' skips that job but the run still reads
            # 'success'; using its sha would move the base too far forward and skip real commits).
            concl=$(api "/actions/runs/${rid}/jobs" \
              | jq -r '.jobs[] | select(.name == "deploy") | .conclusion' | head -1)
            if [ "$concl" = "success" ]; then
              base=$(api "/actions/runs/${rid}" | jq -r '.head_sha')
              break
            fi
          done
          if [ -z "$base" ] || [ "$base" = "null" ]; then
            echo "::error::Could not resolve a previous successful production deploy to gate against. Blocking (fail-closed) rather than shipping unchecked." >&2
            exit 1
          fi
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "::error::Last-deploy commit ${base} is not in local history - checkout must use fetch-depth: 0. Blocking (fail-closed)." >&2
            exit 1
          fi
          echo "Functionality gate will diff the last production deploy ${base}...HEAD"
          echo "FUNCTIONALITY_GATE_BASE=${base}" >> "$GITHUB_ENV"

      # Nothing new ships untested (installed 2026-09-17). BLOCKING - never continue-on-error.
      # What counts as a functionality: docs/WHAT-COUNTS-AS-A-FUNCTIONALITY.md
      # --diff <last-production-deploy>...HEAD so EVERY commit since we last shipped is checked,
      # whether it arrived through a PR or was pushed straight to master.
      - name: Nothing new shipped without its test (BLOCKING)
        run: node scripts/check-new-functionality-registered.mjs --diff "${FUNCTIONALITY_GATE_BASE}...HEAD"

      - name: Feature Coverage Check
        run: node scripts/check-feature-coverage.mjs

      - name: Install Puppeteer browser for prerendering
        run: npx puppeteer browsers install chrome

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Sentry (error monitoring): DSN inlined into the bundle + source-map upload.
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          # PUBLIC Cloudflare Turnstile site key. Without this line the bundle ships with NO
          # captcha widget at all — see the assertion below, which is what makes that impossible
          # to miss.
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}

      - name: Assert the Turnstile site key actually landed in the bundle (blocking)
        # A CAPTCHA THE CLIENT CANNOT ANSWER IS A WORSE OUTAGE THAN THE HOLE IT CLOSES.
        # `vite build` inlines VITE_* at BUILD time, and src/components/auth/TurnstileWidget.tsx
        # deliberately renders NOTHING when VITE_TURNSTILE_SITE_KEY is unset. So an empty, missing
        # or wrong secret produces a widget-less bundle that looks completely healthy: every
        # runtime monitor stays green, and it becomes a TOTAL customer lockout — login, signup and
        # password reset all refused — the instant security_captcha_enabled is switched on
        # project-wide. ReplyFlow hit exactly this shape ("dead sitekey, green monitors").
        # `gh secret list` proves only that a NAME exists; this step is what proves the VALUE.
        # The site key is PUBLIC (it ships in every visitor's browser), so it is pinned literally
        # here and compared — a secret that is merely non-empty is not good enough.
        run: |
          set -euo pipefail
          expected='0x4AAAAAAEz4tOM8hsZWk2Ed'
          if ! grep -rq "$expected" ./dist/; then
            echo "::error::The Turnstile site key ($expected) is NOT in the production bundle."
            echo "  vite build inlines VITE_* at build time; the repository secret"
            echo "  VITE_TURNSTILE_SITE_KEY is empty, wrong, or was not passed to the build step."
            echo "  Shipping this renders no captcha widget at all, and enabling captcha"
            echo "  server-side afterwards would lock every real customer out of login, signup"
            echo "  and password reset. Nothing was deployed."
            exit 1
          fi
          echo "ok - Turnstile site key is present in the production bundle ($(grep -rl "$expected" ./dist/ | wc -l) file(s))."

      # Put-list completeness gate: mirrors SignalScore's gate (added 2026-08-06
      # after it caught a real bug there — a hardcoded upload list silently
      # dropped a new prerendered page). The "Deploy root files and static
      # directories" step below uploads dist/ via named `put`/`mirror` entries,
      # not a recursive mirror of the whole tree — so a new root-level dist/
      # entry (new public/ asset, new generated file) that nobody added there
      # would silently never reach production. Fail the deploy instead.
      - name: Put-list completeness gate
        run: |
          COVERED="assets fonts avatars en .site-id index.html .htaccess favicon.svg favicon.ico favicon-16x16.png favicon-32x32.png apple-touch-icon.png site.webmanifest robots.txt sitemap.xml monitor-routes.json og-image.png logo.png"
          MISSING=""
          for entry in $(ls -A dist); do
            case " $COVERED " in
              *" $entry "*) ;;
              *) MISSING="$MISSING $entry" ;;
            esac
          done
          if [ -n "$MISSING" ]; then
            echo "::error::dist/ contains entries the FTP put-list does not upload:$MISSING — add them to the 'Deploy root files and static directories' step or they will silently never reach production."
            exit 1
          fi
          echo "Put-list covers all dist/ root entries."

      # Database changes ship WITH the release (2026-08-21, proven pattern from
      # replyflow/BackOffice). Before this, the workflow deployed the site but never
      # the database, so every schema change needed a separate manual action — and
      # manual steps get skipped. Runs BEFORE the FTP deploy: code that expects a
      # new column must not go live ahead of the column. No-op when the ledger
      # (supabase_migrations.schema_migrations) is current.
      - name: Apply database migrations to production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/apply-migrations.mjs --project-ref rlcsuqwqzoqjykdiqjye

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Write site-id marker
        run: echo "scoutcopilot" > dist/.site-id

      - name: Verify deploy target (site-id guard)
        run: |
          # set +e: bash -e aborts OUTPUT=$(lftp…) before this retry loop can iterate (deploy-standard §3f).
          set +e
          n=0
          REMOTE_ID=""
          until [ $n -ge 4 ]; do
            OUTPUT=$(timeout 90 lftp -u "$FTP_USER,$FTP_PASS" "ftp://$FTP_HOST" -e "set net:timeout 30; set net:max-retries 2; set ftp:ssl-force yes; set ssl:verify-certificate no; set ftp:ssl-protect-data no; cat /httpdocs/.site-id; quit" 2>&1)
            STATUS=$?
            if [ $STATUS -eq 0 ]; then
              REMOTE_ID="$OUTPUT"
              break
            fi
            # 530 is an FTP REPLY CODE, so it only counts where a reply code can appear.
            # A bare `grep -q "530"` matched a hashed asset FILENAME and killed a real
            # deploy on another product on 2026-09-02
            # (Inter_100Thin_Italic.1b97f7df9b976cfe530c18c09598e6f6.ttf). Do not
            # "simplify" this back to a substring test.
            if echo "$OUTPUT" | grep -qiE '(^|[^[:alnum:]])530[[:space:]]+[A-Za-z]|login (incorrect|failed)'; then
              echo "::error::Site-id guard FTP login failed (530 — bad credentials); not retrying."
              exit 1
            fi
            n=$((n + 1))
            echo "::warning::Site-id guard FTP attempt $n failed (transient FTPS data-channel blip — runner-side); retrying in 25s..."
            sleep 25
          done
          # An EMPTY id is not a match failure, so `-n` below let it through - which is exactly
          # what a 530, a timeout or a dropped connection produces. The guard cannot tell those
          # apart from "file absent", so it must not deploy blind. Every live target has a seeded
          # .site-id (all 13 verified reading non-empty on 2026-08-23); a genuinely new target must
          # have its .site-id seeded first. Copied in spirit from Valrano, which had this right.
          if [ -z "$REMOTE_ID" ]; then
            echo "::error::Site-id guard INCONCLUSIVE: read no .site-id (timeout, dropped connection, bad credential or missing file - indistinguishable). Refusing to deploy blind."
            exit 1
          fi
          if [ -n "$REMOTE_ID" ] && [ "$REMOTE_ID" != "scoutcopilot" ]; then
            echo "::error::DEPLOY ABORTED — remote .site-id is '$REMOTE_ID', expected 'scoutcopilot'. Wrong FTP target!"
            exit 1
          fi
          echo "Site-id guard passed (remote='${REMOTE_ID:-<none>}')"
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}

      - name: Deploy assets (no deletion — zero-downtime overlap)
        run: |
          # set +e: GitHub runs steps with bash -e, which aborts OUTPUT=$(lftp…) on the
          # first failure BEFORE this retry loop can iterate (dead-retry, deploy-standard §3f).
          set +e
          n=0
          until [ $n -ge 4 ]; do
          OUTPUT=$(timeout 420 lftp -u "$FTP_USER,$FTP_PASS" "ftp://$FTP_HOST" <<SCRIPT 2>&1
          set ftp:ssl-force yes; set ssl:verify-certificate no; set ftp:ssl-protect-data no
          set ftp:passive-mode yes; set ftp:prefer-epsv no; set net:timeout 30; set net:max-retries 4; set net:persist-retries 4; set net:reconnect-interval-base 8; set mirror:parallel-transfer-count 4
          mirror --reverse --verbose --no-perms \
            ./dist/assets/ /httpdocs/assets/
          bye
          SCRIPT
          )
          STATUS=$?
          echo "$OUTPUT"
          if [ $STATUS -eq 0 ]; then
            echo "Deploy assets succeeded (attempt $((n+1)))"; exit 0
          fi
          # 530 is an FTP REPLY CODE — match it only where a reply code can appear. A bare
          # substring test matched a hashed asset filename and killed a real deploy on another
          # product on 2026-09-02; do not "simplify" this back.
          if echo "$OUTPUT" | grep -qiE '(^|[^[:alnum:]])530[[:space:]]+[A-Za-z]|login (incorrect|failed)'; then
            echo "::error::Deploy assets FTP login failed (530 — bad credentials); not retrying."; exit 1
          fi
          n=$((n + 1)); echo "::warning::Deploy assets attempt $n failed (transient FTPS data-channel blip — runner-side); retrying in 25s..."; sleep 25
          done
          echo "::error::Deploy assets failed after 4 attempts"; exit 1
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}

      - name: Deploy root files and static directories
        run: |
          # set +e: GitHub runs steps with bash -e, which aborts OUTPUT=$(lftp…) on the
          # first failure BEFORE this retry loop can iterate (dead-retry, deploy-standard §3f).
          set +e
          n=0
          until [ $n -ge 4 ]; do
          OUTPUT=$(timeout 420 lftp -u "$FTP_USER,$FTP_PASS" "ftp://$FTP_HOST" <<SCRIPT 2>&1
          set ftp:ssl-force yes; set ssl:verify-certificate no; set ftp:ssl-protect-data no
          set ftp:passive-mode yes; set ftp:prefer-epsv no; set net:timeout 30; set net:max-retries 4; set net:persist-retries 4; set net:reconnect-interval-base 8; set mirror:parallel-transfer-count 4
          mirror --reverse --verbose --no-perms \
            ./dist/fonts/ /httpdocs/fonts/
          mirror --reverse --verbose --no-perms \
            ./dist/avatars/ /httpdocs/avatars/
          mirror --reverse --verbose --no-perms --delete \
            ./dist/en/ /httpdocs/en/
          put ./dist/.site-id -o /httpdocs/.site-id
          put ./dist/index.html -o /httpdocs/index.html
          put ./dist/.htaccess -o /httpdocs/.htaccess
          put ./dist/favicon.svg -o /httpdocs/favicon.svg
          put ./dist/favicon.ico -o /httpdocs/favicon.ico
          put ./dist/favicon-16x16.png -o /httpdocs/favicon-16x16.png
          put ./dist/favicon-32x32.png -o /httpdocs/favicon-32x32.png
          put ./dist/apple-touch-icon.png -o /httpdocs/apple-touch-icon.png
          put ./dist/site.webmanifest -o /httpdocs/site.webmanifest
          put ./dist/robots.txt -o /httpdocs/robots.txt
          put ./dist/sitemap.xml -o /httpdocs/sitemap.xml
          put ./dist/monitor-routes.json -o /httpdocs/monitor-routes.json
          put ./dist/og-image.png -o /httpdocs/og-image.png
          put ./dist/logo.png -o /httpdocs/logo.png
          bye
          SCRIPT
          )
          STATUS=$?
          echo "$OUTPUT"
          if [ $STATUS -eq 0 ]; then
            echo "Deploy root files succeeded (attempt $((n+1)))"; exit 0
          fi
          # 530 is an FTP REPLY CODE — match it only where a reply code can appear. A bare
          # substring test matched a hashed asset filename and killed a real deploy on another
          # product on 2026-09-02; do not "simplify" this back.
          if echo "$OUTPUT" | grep -qiE '(^|[^[:alnum:]])530[[:space:]]+[A-Za-z]|login (incorrect|failed)'; then
            echo "::error::Deploy root files FTP login failed (530 — bad credentials); not retrying."; exit 1
          fi
          n=$((n + 1)); echo "::warning::Deploy root files attempt $n failed (transient FTPS data-channel blip — runner-side); retrying in 25s..."; sleep 25
          done
          echo "::error::Deploy root files failed after 4 attempts"; exit 1
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}

      - name: Prune stale assets (14-day retention)
        # Replaces the old `mirror --delete` on assets/, which deleted every superseded
        # hashed chunk the moment a deploy landed — so any tab still running the previous
        # index.html got "Failed to fetch dynamically imported module" on its next lazy
        # navigation (fleet Sentry reports 2026-08-29, e.g. valrano staging). Old chunks
        # are now kept for 14 days — long after every open tab has reloaded — and pruned
        # by age afterwards. Same step shape as deploy-staging.yml; see there for the
        # full rationale (lftp has no find -mtime; MDTM probing; never fails the deploy).
        continue-on-error: true
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          ASSETS_DIR: /httpdocs/assets
        run: |
          # GitHub wraps every run block in bash -e: a failing command substitution in an
          # assignment (e.g. LIST=$(lftp ...)) would abort the whole step BEFORE the script's
          # own rc guards run. Cleanup must never abort mid-run — disable -e first.
          set +e
          set -u
          export TZ=UTC
          DAYS=14
          CUTOFF=$(date -u -d "$DAYS days ago" +%Y%m%d%H%M%S)
          SETTINGS="set ftp:ssl-force yes
          set ssl:verify-certificate no; set ftp:ssl-protect-data no
          set ftp:passive-mode yes; set net:timeout 60"

          LIST=$(timeout 180 lftp -u "$FTP_USER,$FTP_PASS" "ftp://$FTP_HOST" <<SCRIPT 2>&1
          $SETTINGS
          find $ASSETS_DIR
          quit
          SCRIPT
          )
          if [ $? -ne 0 ]; then
            echo "::error::Asset prune: listing $ASSETS_DIR failed - leaving cleanup to the next deploy. Output: $(echo "$LIST" | head -3)"
            exit 0
          fi
          if [ -z "$(echo "$LIST" | tr -d '[:space:]')" ]; then
            echo "Asset prune: $ASSETS_DIR is empty - nothing to do."
            exit 0
          fi

          PROBE_SCRIPT=$(mktemp)
          {
            echo "open -u $FTP_USER,$FTP_PASS ftp://$FTP_HOST"
            echo "$SETTINGS"
            # find prints full remote paths recursively (nested chunk dirs included);
            # normalize to a path relative to ASSETS_DIR so either format is safe.
            echo "$LIST" | while IFS= read -r p; do
              p="${p%$'\r'}"
              [ "$p" = "$ASSETS_DIR" ] && continue
              rel="${p#"$ASSETS_DIR"/}"
              [[ "$rel" =~ ^[A-Za-z0-9._/-]+$ ]] || continue
              echo "echo \"PROBE:$ASSETS_DIR/$rel\""
              echo "quote MDTM $ASSETS_DIR/$rel"
            done
            echo "quit"
          } > "$PROBE_SCRIPT"

          OUT=$(timeout 420 lftp -f "$PROBE_SCRIPT" 2>&1)
          rm -f "$PROBE_SCRIPT"

          PAIRED=$(awk '
            /^PROBE:/ { file=substr($0, 7); next }
            file != "" {
              if ($1 == "213" && $2 ~ /^[0-9]{14}$/) print $2, file
              file=""
            }' <<< "$OUT")
          if [ -z "$PAIRED" ]; then
            echo "::error::Asset prune: no MDTM replies from $ASSETS_DIR (server may not support RFC 3659 MDTM) - leaving cleanup to the next deploy."
            exit 0
          fi

          OLD=$(sort -n <<< "$PAIRED" | awk -v cutoff="$CUTOFF" '$1 < cutoff {print $2}' | head -1000)
          COUNT=$(echo "$OLD" | grep -c . || true)
          if [ "$COUNT" -eq 0 ]; then echo "Asset prune: nothing older than $DAYS days in $ASSETS_DIR."; exit 0; fi

          DEL_SCRIPT=$(mktemp)
          {
            echo "open -u $FTP_USER,$FTP_PASS ftp://$FTP_HOST"
            echo "$SETTINGS"
            # $OLD already holds full remote paths (the PROBE: values).
            echo "$OLD" | while IFS= read -r f; do echo "rm $f"; done
            echo "quit"
          } > "$DEL_SCRIPT"
          DEL_OUT=$(timeout 300 lftp -f "$DEL_SCRIPT" 2>&1)
          rm -f "$DEL_SCRIPT"
          echo "$DEL_OUT"
          echo "Asset prune: deleted $COUNT file(s) older than $DAYS days from $ASSETS_DIR."
          exit 0

      - name: Verify production is alive (post-deploy smoke test)
        run: |
          # -L: the apex "/" does a 301 language redirect to /en (i18n). Without
          # following it the smoke test saw the 301, failed the != 200 check, and
          # reddened every deploy though the site was healthy.
          STATUS=$(curl -s -L -o /dev/null -w "%{http_code}" https://scoutcopilot.com/ --retry 4 --retry-all-errors --retry-delay 8 --max-time 30)
          if [ "$STATUS" != "200" ]; then
            echo "::error::Production returned HTTP $STATUS after deploy — investigate immediately."
            exit 1
          fi
          echo "Production health check passed (HTTP $STATUS)"
