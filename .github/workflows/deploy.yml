name: Deploy to Production

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Write site-id marker
        run: echo "scoutcopilot" > dist/.site-id

      - name: Verify deploy target (site-id guard)
        run: |
          REMOTE_ID=$(lftp -u "$FTP_USER,$FTP_PASS" "ftp://$FTP_HOST" -e "set ftp:ssl-allow no; cat /httpdocs/.site-id; quit" 2>/dev/null || echo "")
          if [ -n "$REMOTE_ID" ] && [ "$REMOTE_ID" != "scoutcopilot" ]; then
            echo "::error::DEPLOY ABORTED — remote .site-id is '$REMOTE_ID', expected 'scoutcopilot'. Wrong FTP target!"
            exit 1
          fi
          echo "Site-id guard passed (remote='${REMOTE_ID:-<none>}')"
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}

      - name: Deploy assets (no deletion — zero-downtime overlap)
        run: |
          lftp -u "$FTP_USER,$FTP_PASS" "ftp://$FTP_HOST" <<SCRIPT
          set ftp:ssl-allow no
          mirror --reverse --verbose --no-perms \
            ./dist/assets/ /httpdocs/assets/
          bye
          SCRIPT
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}

      - name: Deploy root files and static directories
        run: |
          lftp -u "$FTP_USER,$FTP_PASS" "ftp://$FTP_HOST" <<SCRIPT
          set ftp:ssl-allow no
          mirror --reverse --verbose --no-perms \
            ./dist/fonts/ /httpdocs/fonts/
          mirror --reverse --verbose --no-perms \
            ./dist/avatars/ /httpdocs/avatars/
          put ./dist/.site-id -o /httpdocs/.site-id
          put ./dist/index.html -o /httpdocs/index.html
          put ./dist/.htaccess -o /httpdocs/.htaccess
          put ./dist/favicon.svg -o /httpdocs/favicon.svg
          put ./dist/favicon.ico -o /httpdocs/favicon.ico
          put ./dist/favicon-16x16.png -o /httpdocs/favicon-16x16.png
          put ./dist/favicon-32x32.png -o /httpdocs/favicon-32x32.png
          put ./dist/apple-touch-icon.png -o /httpdocs/apple-touch-icon.png
          put ./dist/site.webmanifest -o /httpdocs/site.webmanifest
          put ./dist/robots.txt -o /httpdocs/robots.txt
          put ./dist/sitemap.xml -o /httpdocs/sitemap.xml
          put ./dist/og-image.png -o /httpdocs/og-image.png
          put ./dist/logo.png -o /httpdocs/logo.png
          bye
          SCRIPT
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}

      - name: Clean up stale assets
        run: |
          lftp -u "$FTP_USER,$FTP_PASS" "ftp://$FTP_HOST" <<SCRIPT
          set ftp:ssl-allow no
          mirror --reverse --verbose --no-perms --delete \
            ./dist/assets/ /httpdocs/assets/
          bye
          SCRIPT
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
