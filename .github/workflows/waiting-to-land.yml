name: Nothing may sit ready to land

# BLOCKING BY BEING RED, WHICH IS THE WHOLE POINT.
#
# 2026-09-06: SignalScore and ChannelMover could not be promoted to production all day. The
# correct fix — one line of YAML — existed the entire time, in three open pull requests, green
# and mergeable. The deploy watcher that wrote them is forbidden to merge (correct: an
# unattended agent must not write to main) and NOTHING TOLD ANYBODY, so it re-diagnosed and
# re-opened the same fix on its next run. Two further repairs had been green and mergeable in
# those repositories since 2026-08-29 — eight days — and nobody had noticed those either.
#
# SCOUTCOPILOT IS HERE BECAUSE IT WAS THE ONE PRODUCT THE NEW WATCH COULD NOT SEE. When the
# check was rolled out on 2026-09-06 it reached signalscore, ChannelMover, ReplyFlow, BoatBuddy
# and Valrano — every product that already carried @predivo-gmbh/gate-kit. This repository had
# no gate-kit dependency and no bump-gate-kit workflow, so neither of the two checks built that
# day arrived, and it stayed the one place where a forgotten fix could still go unnoticed. That
# gap was open from 2026-09-06 until this file landed.
#
# A boundary that hands work to a human who is never told is a boundary that drops the work.
# This job is the telling. It grants nobody merge rights and loosens no boundary; it turns a
# silent wait into a red scheduled run, in the machinery the deploy page and the production
# monitor already read.
#
# The check itself is gate-kit's, shared by all six products (conformance/waiting-to-land.js,
# 13 tests). It has no branch filter and no author filter on purpose: two of the four pull
# requests behind it were on `fix/...` branches, and every pull request here is authored by the
# shared Predivo-GmbH identity, so neither field can tell an agent's fix from anyone else's.
#
# To stop it complaining about a pull request that is waiting DELIBERATELY: mark it draft, or
# label it `parked`. That is a positive act — silence is never read as consent.

on:
  schedule:
    # Staggered across the fleet so the products do not all call the API in the same minute.
    # Taken: signalscore :20, ChannelMover :35, replyflow :45, BoatBuddy :50, Valrano :55.
    - cron: '10 6,12,18 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  # `checks: read` is required to read a pull request's check-runs, and its absence is why the
  # first live run of this job exited 2 with "HTTP 403". SignalScore and ChannelMover had passed
  # the same code minutes earlier only because neither had an open pull request to look at — a
  # green run that proved nothing, which is the failure this whole day is about. The check itself
  # behaved correctly: it refused loudly rather than reporting nothing found.
  checks: read
  packages: read

env:
  # Needed by npm ci: .npmrc points @predivo-gmbh at GitHub Packages.
  # PACKAGES_READ_TOKEN IS PRESENT AND EMPTY IN THIS REPOSITORY (measured 2026-09-10). It was
  # created 2026-09-09T18:21:08Z with no value: a working repo prints `NODE_AUTH_TOKEN: ***` in
  # its log, ScoutCopilot printed `NODE_AUTH_TOKEN:` followed by nothing, and every install of an
  # @predivo-gmbh package here 401s. Nothing caught it for a day because this repo had no
  # @predivo-gmbh dependency, so npm never reached the private registry to be refused.
  # `secrets.GITHUB_TOKEN` can read org packages the package grants this repository, and every
  # job already has one, so it is the fallback rather than a second credential to keep alive.
  # An empty secret is falsy in an expression, so the real token wins the moment it is set.
  NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}

jobs:
  waiting-to-land:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm ci

      # A RED THAT SAYS "Cannot find module" IS A RED NOBODY ACTS ON (added 2026-09-10).
      # This job failed three times a day from the day it landed, with a MODULE_NOT_FOUND stack
      # for gate-kit's script, and it read like a broken workflow rather than a missing
      # dependency. It is missing because @predivo-gmbh/gate-kit cannot be installed here yet:
      # PACKAGES_READ_TOKEN is empty, and the fallback GITHUB_TOKEN gets
      # `403 permission_denied: read_package` because the gate-kit package does not grant this
      # repository access. Both dispatches of Bump gate-kit died on that (34525853766 401,
      # 34526484870 403). Until one of those is fixed this job cannot do its work - so it says
      # WHICH, in one line, instead of printing a stack.
      - name: Is the check even installed?
        run: |
          if [ ! -f node_modules/@predivo-gmbh/gate-kit/scripts/verify-nothing-waits-to-land.mjs ]; then
            echo "::error::gate-kit is not installed here, so nothing is watching for fixes that never land. Grant the @predivo-gmbh/gate-kit package Actions read access to this repository (org packages -> gate-kit -> settings -> Manage Actions access -> add Predivo-GmbH/ScoutCopilot), or set a non-empty PACKAGES_READ_TOKEN with read:packages. Then re-run the 'Bump gate-kit' workflow with version 0.5.1."
            exit 1
          fi
          echo "gate-kit $(node -p "require('./node_modules/@predivo-gmbh/gate-kit/package.json').version") is installed"

      - name: Is anything ready to land and not landing?
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GRACE_HOURS: '3'
        run: node node_modules/@predivo-gmbh/gate-kit/scripts/verify-nothing-waits-to-land.mjs
