name: Design Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths:
      - '**/*.tsx'
      - '**/*.jsx'
      - '**/*.css'
      - '**/*.scss'
      - '**/*.html'
      - '**/*.svg'
      - '**/tailwind.config.*'
      - '**/postcss.config.*'

# Collapse superseded runs: when several pushes land in a row only the
# newest commit needs testing. Safe here — these jobs never write to prod.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  design-review:
    # Auto-generated content changes (the SEO blog refresh, batched rewrites, dependency
    # bumps) are not code and do not need an engineering review. 41 of the 45 changes in the
    # 31 days to 2026-08-28 were exactly that, so reviewing them would be nearly all of the
    # cost and none of the value.
    if: >-
      github.event.pull_request.draft == false
      && !startsWith(github.head_ref, 'seo-auto-refresh/')
      && !startsWith(github.head_ref, 'seo-refresh-batch')
      && !startsWith(github.head_ref, 'seo/')
      && github.event.pull_request.user.login != 'dependabot[bot]'
      && github.event.pull_request.user.login != 'renovate[bot]'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    # A reviewer that cannot run must NOT report success. Until 2026-08-28 a missing key
    # only printed a warning and this job went green in 11 seconds having read nothing, so
    # changes were merged on the strength of a review that never happened. The key is now
    # installed on every repo carrying this workflow; if it ever goes missing, this fails
    # and says why.
    env:
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
      # claude-code-action@v1 exchanges an OIDC token for its GitHub App token, even when
      # an API key is supplied. Without this the action dies with "Could not fetch an OIDC
      # token" after ~30s and the gate goes red having reviewed nothing.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fail when the reviewer cannot run (no API key configured)
        if: env.HAS_KEY != 'true'
        run: |
          echo "::error::ANTHROPIC_API_KEY is not set on this repository, so this review cannot run."
          echo "A review that cannot run must not report success - that is how unreviewed changes get merged."
          exit 1

      - name: Count what this PR already says (before the review)
        id: before
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ github.api_url }}/repos/${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          n=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" "$API/issues/$PR/comments?per_page=100" | jq '[.[]|select(.user.login=="github-actions[bot]")]|length')
          m=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" "$API/pulls/$PR/comments?per_page=100" | jq '[.[]|select(.user.login=="github-actions[bot]")]|length')
          echo "count=$((n+m))" >> "$GITHUB_OUTPUT"

      - name: Run Design Review
        if: env.HAS_KEY == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          # claude-code-action@v1 accepts `prompt` and `claude_args`. The old `model`,
          # `direct_prompt` and `allowed_tools` inputs are rejected ("Unexpected input(s)")
          # and the prompt was silently discarded, so this gate never reviewed anything.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Post as the repo's own Actions bot. Without a token the action tries to mint
          # one from the Claude Code GitHub App and dies with "not installed on this
          # repository"; using GITHUB_TOKEN keeps the whole thing in version control and
          # grants no third-party app access to the org.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: --model claude-sonnet-4-6 --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Read,Glob,Grep"
          prompt: |
            You are an elite design reviewer. Review this PR for visual quality,
            accessibility, and design system compliance.

            Check the following:

            1. **Visual Consistency**: Colors, typography, spacing match design system
            2. **Accessibility (WCAG 2.1 AA)**: Contrast ratios, focus indicators, ARIA labels
            3. **Responsiveness**: Layouts work at desktop, tablet, and mobile breakpoints
            4. **Code Quality**: No hardcoded colors/sizes, proper use of design tokens
            5. **Component Patterns**: Correct use of existing UI components
            6. **Interaction States**: Hover, focus, active, disabled, loading, empty, error states

            If `/context/design-principles.md` or `/context/style-guide.md` exist,
            reference them for project-specific standards.

            Categorize findings as:
            - **[Blocker]**: Broken UI, accessibility violation
            - **[High]**: Visual regression, responsiveness failure
            - **[Medium]**: Design system inconsistency
            - **[Nit]**: Minor polish

            Include specific file:line references for each finding.
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            HOW TO REPORT. Your findings must land on the pull request, not in your reply.
            A review nobody can read is the same as no review, and the check will still go
            green, which is exactly the failure this gate was rebuilt to stop (2026-08-28).
            - Use `gh pr comment` for the overall verdict.
            - Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`)
              for each specific issue, anchored to the file and line.
            - Post GitHub comments only. Do not return the review as your message text.
            - If you genuinely find nothing, say so in one short `gh pr comment` so the
              silence is a decision on the record rather than an absence.
      # A reviewer that runs for three minutes and then says nothing leaves a GREEN check
      # and no review. That happened on signalscore on 2026-08-28 even with the tools
      # allowed and the instruction given, so it is no longer left to the model's judgement:
      # if the PR gained no comment, this gate fails.
      - name: A silent reviewer is a failed reviewer
        if: env.HAS_KEY == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ github.api_url }}/repos/${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ steps.before.outputs.count }}
        run: |
          n=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" "$API/issues/$PR/comments?per_page=100" | jq '[.[]|select(.user.login=="github-actions[bot]")]|length')
          m=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" "$API/pulls/$PR/comments?per_page=100" | jq '[.[]|select(.user.login=="github-actions[bot]")]|length')
          after=$((n+m))
          echo "comments before=$BEFORE after=$after"
          if [ "$after" -le "$BEFORE" ]; then
            echo "::error::The reviewer ran but posted nothing to this pull request, so there is no review to read. A green check here would be a lie."
            exit 1
          fi
