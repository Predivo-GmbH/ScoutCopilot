name: Critical Path Tests

on:
  push:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [master]
  workflow_dispatch:

# Collapse superseded runs: when several pushes land in a row only the
# newest commit needs testing. Safe here — these jobs never write to prod.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read
  # `actions: read` is what lets the rotation guard ask the API whether the password-rotation
  # workflow has a green run. It used to shell out to `gh`, which does not exist on our
  # self-hosted runner, so the suite died with `spawnSync gh ENOENT` on every push to master
  # from the day this step was added. Reading runs over HTTPS needs this scope and no binary.
  actions: read

env:
  # Needed by npm ci: .npmrc points @predivo-gmbh at GitHub Packages. Without this the
  # install 401s on @predivo-gmbh/gate-kit. A job must carry the environment its steps read:
  # that is the workflow-env check gate-kit 0.4.3 added on 2026-09-06, which never reached
  # this repository because it had no gate-kit dependency to reach it by.
  # PACKAGES_READ_TOKEN IS PRESENT AND EMPTY IN THIS REPOSITORY (measured 2026-09-10). It was
  # created 2026-09-09T18:21:08Z with no value: a working repo prints `NODE_AUTH_TOKEN: ***` in
  # its log, ScoutCopilot printed `NODE_AUTH_TOKEN:` followed by nothing, and every install of an
  # @predivo-gmbh package here 401s. Nothing caught it for a day because this repo had no
  # @predivo-gmbh dependency, so npm never reached the private registry to be refused.
  # `secrets.GITHUB_TOKEN` can read org packages the package grants this repository, and every
  # job already has one, so it is the fallback rather than a second credential to keep alive.
  # An empty secret is falsy in an expression, so the real token wins the moment it is set.
  NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}

jobs:
  critical-path:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    # 25, not 10. MEASURED 2026-09-15 on the shared self-hosted host, one run each:
    # ChannelMover 13m12s, BackOffice 11m30s, BoatBuddy 8m25s, ScoutCopilot 6m35s - and
    # ReplyFlow was KILLED at 10m27s by a 10-minute budget on a suite that had passed in
    # 3m52s, 5m00s, 6m38s and 7m48s earlier the same morning. The budget was not sized for
    # a machine running several suites at once, which is this host's normal state.
    # This is not masking a slow test: a timeout only ever fires when something is already
    # wrong, so a budget above the real worst case costs nothing on a healthy run and stops
    # turning a busy machine into a red gate. ChannelMover (40) and BackOffice (25) already
    # carry a realistic budget for exactly this reason; these repos never got the change.
    # A job that hits timeout-minutes is reported as CANCELLED or failed and has to be run
    # AGAIN - across the fleet 55 of 179 suite runs in the last window ended cancelled,
    # producing no answer at all. That re-run is the most expensive kind of red there is.
    timeout-minutes: 25
    env:
      # Ubuntu 26.04 (what our self-hosted runners came up on, 2026-08-25) has no Playwright
      # browser build: `npx playwright install chromium` dies with "Playwright does not
      # support chromium on ubuntu26.04-x64". No newer Playwright fixes this - it is already
      # current - so this is Playwright's own documented escape hatch, and it selects exactly
      # the fallback Playwright itself applies to any distro it does not recognise.
      # Must be JOB-level, not on the install step: the browser cache path is keyed by host
      # platform, so install and the test run have to resolve the same key or the run will
      # not find what install downloaded. The "-x64" suffix is required; a bare "ubuntu24.04"
      # is rejected the same way. Harmless on GitHub-hosted runners, which resolve to it anyway.
      PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: ubuntu24.04-x64
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # cache: npm removed deliberately - see the "NPM CACHE / self-hosted runner" note in deploy.yml

      - run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        # Skipped on the persistent self-hosted runner: the path already survives there,
        # so the save post-step is a multi-minute upload that buys nothing and can blow
        # the job timeout. see the "NPM CACHE / self-hosted runner" note in deploy.yml
        if: runner.environment != 'self-hosted'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # No cache-hit guard. On GitHub's throwaway machines, skipping the install on a cache
      # hit is a safe optimisation. On a persistent self-hosted runner it is a correctness
      # bug: the cache reports a hit while ~/.cache/ms-playwright holds a DIFFERENT browser
      # build, the install is skipped, and every test dies with "Executable doesn't exist".
      - name: Install Playwright browsers
        run: |
          # --with-deps shells out to `sudo apt-get`. On our self-hosted runner the runner
          # user's sudo is deliberately narrow, because these jobs execute repository code
          # and blanket sudo would let any of it take the machine. The OS libraries are
          # installed once on the host instead; only the browser binaries are per-version,
          # and those need no root.
          # GitHub-hosted runners keep --with-deps: clearing RUNNER_LABEL sends every job
          # back to them, and that fallback has to work on an unprovisioned box.
          if [ "${{ runner.environment }}" = "self-hosted" ]; then
            npx playwright install chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Pick a free dev-server port
        # 24 runners for 14 repos share ONE network namespace on the self-hosted host, so a
        # fixed 5173 collides whenever two Vite e2e suites overlap. Ask the OS for a free port
        # instead. playwright.config.ts reads E2E_PORT and passes Vite --strictPort, so if the
        # port is taken in the gap before Vite binds, the run fails loudly rather than silently
        # testing whatever else is listening.
        run: |
          PORT=$(node -e "const s=require('net').createServer();s.listen(0,()=>{const p=s.address().port;s.close(()=>console.log(p))})")
          echo "E2E_PORT=$PORT" >> "$GITHUB_ENV"
          echo "dev server port: $PORT"

      # THE .test.mjs GUARDS WERE NEVER RUN BY ANYTHING (added 2026-09-09). scripts/ has carried
      # node:test suites for a while and no workflow executed any of them, so a guard could be red
      # for days and look exactly like a guard that found nothing. They need no browser and no dev
      # server, so they run FIRST and fail in seconds rather than after a Playwright install.
      #
      # NOT EVERY SUITE BELONGS HERE, and the first run of this step is what proved it:
      # verify-generate-photo-401-not-logged.test.mjs fires five unauthenticated POSTs at the
      # PRODUCTION generate-photo function and then reads production error_log back through the
      # Management API. It needs a PAT, it touches production, and running it on every push is a
      # different decision from "run the offline guards" - so it is excluded BY NAME, with the
      # reason, rather than quietly.
      #
      # The exclusion list is checked, not trusted: a name on it that no longer exists fails the
      # step. Otherwise the list rots into a way of silently not running things, which is the
      # defect this step exists to remove.
      - name: Run the node:test guard suites
        env:
          # production-db-password-was-rotated.test.mjs reads workflow runs over the REST API.
          # Without a token the repository is private and the call 404s, which would read as
          # "no rotation ever happened" - a false alarm on a credential question.
          GITHUB_TOKEN: ${{ github.token }}
          # the-leaked-mail-password-is-dead.test.mjs asks the production project for the SHA-256
          # DIGEST of METANET_SMTP_PASS (Supabase stores function secrets write-only, so a digest
          # is all that comes back) and asserts it is no longer the value that was printed into a
          # chat on 2026-09-09. Without a token it cannot tell, and it exits 1 saying so rather
          # than passing quietly - so the token has to be here or this step goes red.
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -e
          shopt -s nullglob

          # Suites that need live credentials or touch production. Each needs a home of its own;
          # none may sit here forever unexamined.
          LIVE=(scripts/verify-generate-photo-401-not-logged.test.mjs)

          for f in "${LIVE[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error::excluded suite $f no longer exists - update the LIVE list in this workflow"
              exit 1
            fi
            echo "excluded (needs live credentials / touches production): $f"
          done

          suites=()
          for f in scripts/*.test.mjs; do
            skip=""
            for l in "${LIVE[@]}"; do [ "$f" = "$l" ] && skip=1; done
            [ -n "$skip" ] || suites+=("$f")
          done

          if [ ${#suites[@]} -eq 0 ]; then
            echo "::error::no runnable scripts/*.test.mjs found - the guard suites are not running"
            exit 1
          fi
          echo "running ${#suites[@]} guard suite(s): ${suites[*]}"
          node --test "${suites[@]}"

      - name: Run critical path tests
        run: npx playwright test e2e/critical-path.spec.ts
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: critical-path-results
          path: playwright-report/

  # THE REFUSAL, ASKED WHERE THE DIFF IS REAL. scripts/check-new-functionality-registered.mjs
  # compares origin/master...HEAD and refuses a new user-facing thing that arrives with no register
  # row and no test. It was wired ONLY into deploy.yml (signal ScoutCopilot:e3d0685, 2026-09-17),
  # which runs on workflow_dispatch from master, so HEAD === origin/master === an EMPTY range: the
  # gate exited 0 on every production deploy WITHOUT EVER LOOKING. It never blocked and never could.
  # A pull_request is the only context where "what the product WAS vs what it BECAME" is a non-empty
  # diff, so the gate has to run HERE. It stays inert on the prod deploy by construction, so moving
  # the question to the PR loses nothing there and finally makes it able to refuse something.
  functionality-gate:
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # fetch-depth: 0 so the PR base commit is in local history for the checker to diff
          # against. The default shallow checkout carries only the merge commit, and the diff
          # would read as empty — the exact blindness this job exists to end.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # No `npm ci`: the checker and its recogniser import only node builtins (fs/path/child_process),
      # so this job needs neither the private registry nor a browser and stays a fast, cheap gate.
      - name: Refuse a new functionality that arrives with no row and no test
        run: node scripts/check-new-functionality-registered.mjs --diff "${{ github.event.pull_request.base.sha }}...HEAD"
