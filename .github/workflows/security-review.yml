name: Security Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# Collapse superseded runs: when several pushes land in a row only the
# newest commit needs testing. Safe here — these jobs never write to prod.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-review:
    if: github.event.pull_request.draft == false
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    # Without a key the action fails red and reviews nothing, which reads as "the gate
    # ran and found problems" when it never ran at all. Skip loudly instead.
    env:
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Skip notice (no API key configured)
        if: env.HAS_KEY != 'true'
        run: echo "::warning::ANTHROPIC_API_KEY is not set on this repository - the AI review did not run. Add the secret to enable it."

      - name: Run Security Review
        if: env.HAS_KEY == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          # claude-code-action@v1 accepts `prompt` and `claude_args`. The old `model`,
          # `direct_prompt` and `allowed_tools` inputs are rejected ("Unexpected input(s)")
          # and the prompt was silently discarded, so this gate never reviewed anything.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: --model claude-sonnet-4-6 --allowedTools "Bash(git diff:*),Bash(git log:*),Bash(git show:*),Read,Glob,Grep"
          prompt: |
            You are a senior security engineer. Perform a security-focused code review
            to identify HIGH-CONFIDENCE vulnerabilities with real exploitation potential.

            CRITICAL:
            - Only flag issues where you are >80% confident of actual exploitability
            - Focus ONLY on security implications newly added by this PR
            - Do NOT report: DoS, secrets on disk, rate limiting, theoretical issues

            Categories to examine:
            1. **Input Validation**: SQLi, XSS, Command injection, Path traversal, XXE
            2. **Authentication & Authorization**: Missing auth, IDOR, privilege escalation
            3. **Crypto & Secrets**: Hardcoded secrets, weak crypto, insecure RNG
            4. **Code Execution**: RCE, unsafe deserialization, eval with user input
            5. **Data Exposure**: PII leakage, verbose errors, overly permissive CORS

            FALSE POSITIVE filters — NEVER flag:
            - Framework-provided protections (React XSS escaping, ORM parameterization)
            - Server-side only paths without user input
            - Test files and fixtures
            - TypeScript strict mode type-safe operations
            - Environment variables read at startup
            - Standard library crypto usage

            For each finding, trace the data flow from input to dangerous operation
            and verify no existing mitigation exists.
