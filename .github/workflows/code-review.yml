name: Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# Collapse superseded runs: when several pushes land in a row only the
# newest commit needs testing. Safe here — these jobs never write to prod.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Without a key the action fails red and reviews nothing, which reads as "the gate
    # ran and found problems" when it never ran at all. Skip loudly instead.
    env:
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Skip notice (no API key configured)
        if: env.HAS_KEY != 'true'
        run: echo "::warning::ANTHROPIC_API_KEY is not set on this repository - the AI review did not run. Add the secret to enable it."

      - name: Run Code Review
        if: env.HAS_KEY == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          # claude-code-action@v1 accepts `prompt` and `claude_args`. The old `model`,
          # `direct_prompt` and `allowed_tools` inputs are rejected ("Unexpected input(s)")
          # and the prompt was silently discarded, so this gate never reviewed anything.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: --model claude-sonnet-4-6 --allowedTools "Bash(git diff:*),Bash(git log:*),Bash(git show:*),Read,Glob,Grep"
          prompt: |
            You are the Principal Engineer AI Reviewer enforcing the "Pragmatic Quality" framework.
            Balance rigorous engineering standards with development speed.

            Review this PR using the following prioritized checklist:

            1. **Architectural Design & Integrity** (Critical)
               - Alignment with existing patterns, modularity, SRP, unnecessary complexity
            2. **Functionality & Correctness** (Critical)
               - Business logic, edge cases, race conditions, state management
            3. **Security** (Non-Negotiable)
               - Input validation, auth checks, no hardcoded secrets, data exposure
            4. **Maintainability & Readability** (High)
               - Code clarity, naming, complexity, comments explain 'why' not 'what'
            5. **Testing Strategy** (High)
               - Coverage relative to complexity, failure modes, test isolation
            6. **Performance & Scalability** (Important)
               - N+1 queries, bundle size, caching, memory leaks
            7. **Dependencies & Documentation** (Important)
               - Necessity of new deps, license compatibility, doc updates

            Categorize findings as:
            - **[Critical/Blocker]**: Must fix before merge
            - **[Improvement]**: Strong recommendation
            - **[Nit]**: Optional polish

            Be constructive. Explain the engineering principle behind each suggestion.
